services:
  maillume:
    image: ${MAILLUME_IMAGE:?Set MAILLUME_IMAGE to an immutable GHCR digest}
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Local blocklist cache written by the blocklist-fetcher sidecar; see
      # docs/blocklist-feeds.md. Matching is local-only.
      MAILLUME_BLOCKLIST_CACHE: /app/blocklist/cache.json
    volumes:
      - blocklist:/app/blocklist:ro
    expose:
      - "3000"
    networks:
      default: {}
      edge:
        aliases: [maillume]
    mem_limit: 3g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Refreshes the local blocklist cache (docs/blocklist-feeds.md) from the
  # OpenPhish community feed every hour into the shared volume. A failed
  # refresh is logged and retried next hour; a stale or missing cache makes
  # the blocklist evidence factor contribute nothing.
  blocklist-fetcher:
    image: ${MAILLUME_IMAGE:?Set MAILLUME_IMAGE to an immutable GHCR digest}
    init: true
    restart: unless-stopped
    volumes:
      - blocklist:/app/blocklist
    environment:
      # Optional URLhaus (abuse.ch) API key, interpolated from the deploy
      # env files. A secret: set it in .env.infrastructure on the VPS,
      # never in the repository. Unset means the feed is skipped.
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          node /app/scripts/fetch-blocklist-feeds.mjs /app/blocklist/cache.json \
            || echo "blocklist refresh failed; retrying next hour" >&2
          sleep 3600
        done
    # The sidecar is a shell loop, not the web server: the image's HTTP
    # healthcheck can never pass, so disable it instead of reporting unhealthy.
    healthcheck:
      disable: true
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  blocklist: {}

networks:
  default:
    name: maillume-production
  # Shared with the host's reverse proxy (Caddy), which terminates TLS and reaches the app as
  # `maillume:3000`. Created outside this project; the app publishes no ports itself.
  edge:
    name: ${MAILLUME_EDGE_NETWORK:-maillume-edge}
    external: true
