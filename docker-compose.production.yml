services:
  maillume:
    image: ${MAILLUME_IMAGE:?Set MAILLUME_IMAGE to an immutable GHCR digest}
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      default: {}
      edge:
        aliases: [maillume]
    mem_limit: 3g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    name: maillume-production
  # Shared with the host's reverse proxy (Caddy), which terminates TLS and reaches the app as
  # `maillume:3000`. Created outside this project; the app publishes no ports itself.
  edge:
    name: ${MAILLUME_EDGE_NETWORK:-maillume-edge}
    external: true
