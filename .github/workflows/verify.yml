name: Verify application

on:
  workflow_call:
    inputs:
      upload-integration-artifacts:
        description: Upload the packaged browser-extension and checksum artifacts.
        required: false
        default: false
        type: boolean
      quick:
        description: >-
          Skip the slow database and browser checks. For main, where the same change already
          passed them in its pull request; type, lint, unit, security and contract tests still run.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The local Supabase database takes minutes to start, so pull requests only start it when a
      # change can affect it. Without a base commit (or if it can't be fetched) it always runs.
      - name: Detect database changes
        id: db
        if: ${{ !inputs.quick }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=true
          if [ -n "$BASE_SHA" ] && git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            if ! git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(supabase/|\.github/workflows/verify\.yml$)'; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Database checks needed: $changed"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        if: ${{ !inputs.quick && steps.db.outputs.changed == 'true' }}
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.109.1

      - name: Start local database
        if: ${{ !inputs.quick && steps.db.outputs.changed == 'true' }}
        run: supabase start --ignore-health-check -x edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector

      - name: Database lifecycle tests
        if: ${{ !inputs.quick && steps.db.outputs.changed == 'true' }}
        run: |
          supabase test db --local supabase/tests
          supabase db lint --local --level warning

      - name: Install Chromium
        if: ${{ !inputs.quick }}
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Analysis tests
        run: npm run test:analysis

      - name: Security tests
        run: npm run test:security

      - name: Deployment contract tests
        run: npm run test:deployment

      - name: Integration behavior tests
        run: npm run test:integrations

      - name: Package integration artifacts
        run: npm run package:integrations
        env:
          BUILD_REVISION: ${{ github.sha }}

      - name: Load browser extension
        if: ${{ !inputs.quick }}
        run: npm run test:extension

      - name: Build public demo configuration
        if: ${{ !inputs.quick }}
        run: npm run build
        env:
          ANALYSIS_MODE: heuristic

      - name: Browser smoke tests
        if: ${{ !inputs.quick }}
        run: npm run test:smoke

      - name: Upload browser extension artifact
        if: inputs.upload-integration-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maillume-browser-extension
          path: dist/maillume-browser-extension.zip
          if-no-files-found: error

      - name: Upload integration checksums
        if: inputs.upload-integration-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maillume-integration-checksums
          path: dist/integration-SHA256SUMS
          if-no-files-found: error

      - name: Stop local database
        if: ${{ always() && !inputs.quick && steps.db.outputs.changed == 'true' }}
        run: supabase stop --no-backup

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
