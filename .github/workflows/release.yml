name: Build production image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified image to production
        required: true
        default: false
        type: boolean
      feedback_summary_migration_applied:
        description: Confirm the production feedback-summary migration is applied
        required: true
        default: false
        type: boolean
      extension_pairing_migration_applied:
        description: Confirm the production extension-pairing migration is applied
        required: true
        default: false
        type: boolean
      browser_connections_migration_applied:
        description: Confirm the production browser-connections migration is applied
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/verify.yml
    with:
      upload-integration-artifacts: true
    permissions:
      contents: read
      pull-requests: read

  image:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/matthiasbusscher/maillume
          tags: type=sha,format=long
      - name: Build and load image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_MARKETING_URL=https://maillume.io
            NEXT_PUBLIC_APP_URL=https://app.maillume.io
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_PASSKEYS_ENABLED=${{ vars.NEXT_PUBLIC_PASSKEYS_ENABLED || 'false' }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image revision metadata and runtime
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          label="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$label" != "$EXPECTED_REVISION" ]]; then
            echo "Image revision label does not match the workflow commit." >&2
            exit 1
          fi

          container="$(docker run --rm -d "$IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          verified=false
          for _ in {1..12}; do
            if docker exec -e EXPECTED_REVISION="$EXPECTED_REVISION" "$container" \
              node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{if(!r.ok)process.exit(1);const body=await r.json();if(body.revision!==process.env.EXPECTED_REVISION)process.exit(1)}).catch(()=>process.exit(1))"; then
              verified=true
              break
            fi
            sleep 5
          done

          if [[ "$verified" != true ]]; then
            echo "Image health response does not report the workflow commit." >&2
            exit 1
          fi
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: cyclonedx
          output: maillume-image.cdx.json
          exit-code: "0"

      - name: Upload CycloneDX image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maillume-image-sbom
          path: maillume-image.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR after scan
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image and resolve immutable digest
        id: digest
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ghcr.io/matthiasbusscher/maillume
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE" || "$IMAGE" == *$'\n'* ]]; then
            echo "Expected exactly one image tag from metadata-action." >&2
            exit 1
          fi
          docker push "$IMAGE"
          digest_json="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}')"
          digest="${digest_json#\"}"
          digest="${digest%\"}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the pushed GHCR image to an immutable digest." >&2
            exit 1
          fi
          repository_digest="$IMAGE_NAME@$digest"
          echo "image=$repository_digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # GitHub's public artifact attestations become part of the release evidence
      # once the repository is public. Keep private pre-launch builds deployable.
      - name: Attest published image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/matthiasbusscher/maillume
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  preflight:
    name: Verify deployment prerequisites
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require production migration confirmation
        env:
          BROWSER_CONNECTIONS_MIGRATION_APPLIED: ${{ inputs.browser_connections_migration_applied }}
          EXTENSION_PAIRING_MIGRATION_APPLIED: ${{ inputs.extension_pairing_migration_applied }}
          FEEDBACK_SUMMARY_MIGRATION_APPLIED: ${{ inputs.feedback_summary_migration_applied }}
        run: |
          if [[ "$FEEDBACK_SUMMARY_MIGRATION_APPLIED" != "true" ]]; then
            echo "Apply and verify the production feedback-summary migration before deployment." >&2
            exit 1
          fi
          if [[ "$EXTENSION_PAIRING_MIGRATION_APPLIED" != "true" ]]; then
            echo "Apply and verify the production extension-pairing migration before deployment." >&2
            exit 1
          fi
          if [[ "$BROWSER_CONNECTIONS_MIGRATION_APPLIED" != "true" ]]; then
            echo "Apply and verify the production browser-connections migration before deployment." >&2
            exit 1
          fi
      - name: Verify compatible Chrome extension is live
        run: node scripts/verify-chrome-extension-release.mjs

  resolve:
    name: Resolve verified image
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the already verified SHA image
        id: digest
        env:
          IMAGE_NAME: ghcr.io/matthiasbusscher/maillume
          IMAGE_TAG: ghcr.io/matthiasbusscher/maillume:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          digest_json="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest.Digest}}')"
          digest="${digest_json#\"}"
          digest="${digest%\"}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the verified main-branch image." >&2
            exit 1
          fi
          echo "image=$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out approved deployment artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synchronize deployment artifacts
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          source: docker-compose.production.yml,scripts/deploy-production.sh,scripts/rollback-production.sh,scripts/rehearse-production-rollback.sh
          target: /opt/maillume
          overwrite: true
      - name: Deploy immutable image over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          script: |
            set -eu
            cd /opt/maillume
            chmod 750 \
              ./scripts/deploy-production.sh \
              ./scripts/rollback-production.sh \
              ./scripts/rehearse-production-rollback.sh
            ./scripts/deploy-production.sh '${{ needs.resolve.outputs.image }}' '${{ github.sha }}'
      - name: Verify public deployment revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/verify-public-deployment.mjs
